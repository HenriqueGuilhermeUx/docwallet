[build]
  command = "rm -rf node_modules pnpm-lock.yaml && pnpm install && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
  NPM_CONFIG_USE_CACHE = "false"
  COREPACK_ENABLE_DOWNLOAD_PROMPT = "false"
  COREPACK_ENABLE_AUTO_PIN = "false"
  COREPACK_ENABLE_NETWORK = "0"

[build.processing]
  skip_processing = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
