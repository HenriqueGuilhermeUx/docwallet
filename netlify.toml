# Dedicated DocWallet USA preview only. Brazilian main stays untouched.
[build]
  base = "."
  command = "npm ci --legacy-peer-deps && npm exec -- vite build --config vite.usa.config.ts"
  publish = "dist-usa-docwallet"

[build.environment]
  NODE_VERSION = "22"
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
