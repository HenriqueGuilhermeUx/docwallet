name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing secrets. Create ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD first."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore docwallet-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$ANDROID_KEY_ALIAS" \
            -dname "CN=DocWallet, OU=Alternative Ventures, O=Alternative Ventures, L=Santos, ST=SP, C=BR"
          base64 -w 0 docwallet-release.jks > docwallet-release-base64.txt

      - name: Upload keystore package
        uses: actions/upload-artifact@v4
        with:
          name: docwallet-keystore-private
          path: |
            docwallet-release.jks
            docwallet-release-base64.txt
