name: Build Test APK

on:
  workflow_dispatch:

jobs:
  apk:
    name: Build DocWallet Docs Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_DOCWALLET_API_URL: https://docwallet-backend.onrender.com
          VITE_DOCWALLET_CHAIN_ID: 137
          VITE_DOCWALLET_NETWORK_NAME: Polygon
          VITE_DOCWALLET_RPC_URL: https://polygon-rpc.com
          VITE_DOCWALLET_EXPLORER_URL: https://polygonscan.com/tx
          VITE_DOCWALLET_NATIVE_NAME: POL
          VITE_DOCWALLET_NATIVE_SYMBOL: POL
          VITE_DOCWALLET_NATIVE_DECIMALS: 18
          VITE_DOCWALLET_NOTARIZATION_PRICE_NATIVE: 0.01
          VITE_DOCWALLET_TREASURY_ADDRESS: ${{ secrets.VITE_DOCWALLET_TREASURY_ADDRESS }}
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Force Android target API 35
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9][0-9]*/compileSdkVersion = 35/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9][0-9]*/targetSdkVersion = 35/g' android/variables.gradle
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Apply DocWallet Docs launcher icon
        run: npm run android:icons

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Rename APK
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" docwallet-docs-test.apk

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: docwallet-docs-test-apk
          path: docwallet-docs-test.apk
