name: Build Test APK

on:
  workflow_dispatch:

jobs:
  apk:
    name: Build DocWallet App 2.0 Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_DOCWALLET_API_URL: https://docwallet-backend.onrender.com
          VITE_DOCWALLET_PUBLIC_URL: https://trydocwallet.com
          VITE_DOCWALLET_CHAIN_ID: 137
          VITE_DOCWALLET_NETWORK_NAME: Polygon
          VITE_DOCWALLET_RPC_URL: https://polygon-rpc.com
          VITE_DOCWALLET_EXPLORER_URL: https://polygonscan.com/tx
          VITE_DOCWALLET_NATIVE_NAME: POL
          VITE_DOCWALLET_NATIVE_SYMBOL: POL
          VITE_DOCWALLET_NATIVE_DECIMALS: 18
          VITE_DOCWALLET_NOTARIZATION_PRICE_NATIVE: 0.01
          VITE_DOCWALLET_TREASURY_ADDRESS: ${{ secrets.VITE_DOCWALLET_TREASURY_ADDRESS }}
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Force Android API 36 after sync
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9][0-9]*/compileSdkVersion = 36/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9][0-9]*/targetSdkVersion = 36/g' android/variables.gradle
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk [0-9][0-9]*/compileSdk 36/g' android/app/build.gradle || true
            sed -i 's/targetSdk [0-9][0-9]*/targetSdk 36/g' android/app/build.gradle || true
            sed -i 's/targetSdkVersion [0-9][0-9]*/targetSdkVersion 36/g' android/app/build.gradle || true
          fi
          grep -R "compileSdk\|targetSdk" -n android || true

      - name: Apply DocWallet launcher icon
        run: npm run android:icons

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Rename APK
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" docwallet-app-v2-test.apk

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: docwallet-app-v2-test-apk
          path: docwallet-app-v2-test.apk
