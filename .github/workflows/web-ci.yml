name: Web CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/ios/check-upload-failure-contract.mjs
      - run: npm run build

  upload-ui-retry:
    # UI-only test, isolated from backend and production credentials.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install ephemeral UI test dependencies (no lockfile changes)
        run: npm install --no-save --package-lock=false --no-audit --no-fund vitest@1.6.1 jsdom@24.1.3 @testing-library/react@16.3.0
      - name: Exercise upload retry UI and HTTP failure contracts (synthetic)
        env:
          VITE_DOCWALLET_API_URL: ''
        run: ./node_modules/.bin/vitest run scripts/ios/upload-modal.test.tsx scripts/ios/upload-http.test.ts scripts/ios/private-download.test.ts scripts/ios/private-preview.test.tsx --environment jsdom --pool forks --maxWorkers 1 --minWorkers 1

  local-flask-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCWALLET_OFFLINE_E2E: '1'
      DOCWALLET_LOCAL_E2E_PORT: '8765'
      NEXA_SSO_ENABLED: 'false'
      NEXA_ECOSYSTEM_ATTENTION_ENABLED: 'false'
      DATABASE_URL: sqlite:///${{ runner.temp }}/docwallet-local-test.sqlite3
      UPLOAD_DIR: ${{ runner.temp }}/docwallet-local-documents
      DOCWALLET_LOCAL_E2E_FIXTURES: ${{ runner.temp }}/docwallet-local-fixtures.json
      JWT_SECRET: local-ci-only-not-production
    steps:
      - name: Checkout frontend from PR
        uses: actions/checkout@v4
        with:
          path: frontend
      - name: Checkout backend isolated security branch
        uses: actions/checkout@v4
        with:
          repository: HenriqueGuilhermeUx/docwallet-backend
          ref: test/ios-private-download-contract-20261117
          path: backend
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install local Flask API dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check \
            Flask==3.0.3 Flask-Cors==4.0.1 Flask-SQLAlchemy==3.1.1 \
            SQLAlchemy==2.0.31 python-dotenv==1.0.1 PyJWT==2.8.0 \
            bcrypt==4.1.3 Werkzeug==3.0.3 pypdf==4.3.1 reportlab==4.2.5
          python fix_sqlalchemy.py
          python -m py_compile app.py tests/local_private_download_server.py
      - name: Start isolated Flask server on loopback only
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup python tests/local_private_download_server.py > "$RUNNER_TEMP/docwallet-local-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/docwallet-local-server.pid"
          python - <<'PY'
          import os, time, urllib.error, urllib.request
          url = 'http://127.0.0.1:8765/api/documents'
          for _ in range(50):
              try:
                  urllib.request.urlopen(url, timeout=1)
              except urllib.error.HTTPError as exc:
                  if exc.code == 401:
                      break
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(0.2)
          else:
              raise SystemExit('Synthetic Flask API did not become ready on loopback')
          PY
      - name: Export synthetic identity for local integration only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          fixtures=json.load(open(os.environ['DOCWALLET_LOCAL_E2E_FIXTURES'], encoding='utf-8'))
          vars={
            'DOCWALLET_LOCAL_E2E_DOC_ID':fixtures['document_id'],
            'DOCWALLET_LOCAL_E2E_OWNER':fixtures['owner_token'],
            'DOCWALLET_LOCAL_E2E_OTHER':fixtures['other_token'],
          }
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:
              for key,value in vars.items():
                  out.write(f'{key}={value}\n')
          PY
      - name: Install frontend tests without changing lockfile
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund vitest@1.6.1 jsdom@24.1.3
      - name: Verify actual HTTP Bearer, tenant isolation, query rejection
        working-directory: frontend
        run: ./node_modules/.bin/vitest run scripts/ios/private-download-local-e2e.test.ts --environment node --pool forks --maxWorkers 1 --minWorkers 1
      - name: Stop local HTTP server
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/docwallet-local-server.pid"; then
            kill "$(cat "$RUNNER_TEMP/docwallet-local-server.pid")" 2>/dev/null || true
          fi
