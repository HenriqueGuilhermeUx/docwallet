name: DocWallet USA E-SIGN Isolated Policy CI

on:
  push:
    branches:
      - feature/usa-esign-legal-gates-20261025
    paths:
      - 'src/usa/**'
      - 'tests/usa/**'
      - 'docs/USA_ESIGN_LEGAL_GATES_2026-10-25.md'
      - '.github/workflows/usa-esign-preflight-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esign-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Strict US E-SIGN evidence policy typecheck
        run: deno check --config tests/usa/deno.json tests/usa/esignEvidencePreflight.test.ts tests/usa/esignByteIntegrity.test.ts
      - name: Synthetic E-SIGN and consumer-consent exception tests
        run: deno test --config tests/usa/deno.json tests/usa/esignEvidencePreflight.test.ts tests/usa/esignByteIntegrity.test.ts
