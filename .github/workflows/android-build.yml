name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'play-store/assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'

jobs:
  android:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_DOCWALLET_API_URL: https://docwallet-backend.onrender.com
          VITE_DOCWALLET_PUBLIC_URL: https://docwallet.netlify.app
          VITE_DOCWALLET_CHAIN_ID: 137
          VITE_DOCWALLET_NETWORK_NAME: Polygon
          VITE_DOCWALLET_RPC_URL: https://polygon-rpc.com
          VITE_DOCWALLET_EXPLORER_URL: https://polygonscan.com/tx
          VITE_DOCWALLET_NATIVE_NAME: POL
          VITE_DOCWALLET_NATIVE_SYMBOL: POL
          VITE_DOCWALLET_NATIVE_DECIMALS: 18
          VITE_DOCWALLET_NOTARIZATION_PRICE_NATIVE: 0.01
          VITE_DOCWALLET_TREASURY_ADDRESS: ${{ secrets.VITE_DOCWALLET_TREASURY_ADDRESS }}
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Force Android target API 35
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = [0-9][0-9]*/compileSdkVersion = 35/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9][0-9]*/targetSdkVersion = 35/g' android/variables.gradle
            cat android/variables.gradle
          fi
          grep -R "targetSdk" -n android || true

      - name: Force unique Play Store version
        run: |
          APP_GRADLE="android/app/build.gradle"
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}"
          sed -i "s/versionCode [0-9][0-9]*/versionCode $VERSION_CODE/g" "$APP_GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/g" "$APP_GRADLE"
          echo "Using Android versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          grep -n "versionCode\|versionName" "$APP_GRADLE"

      - name: Sync Android
        run: npx cap sync android

      - name: Apply DocWallet Docs launcher icon
        run: npm run android:icons

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Build release bundle unsigned
        run: cd android && ./gradlew bundleRelease

      - name: Sign release AAB when secrets exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret found. Skipping signed AAB."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > docwallet-release.jks
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)
          cp "$AAB" docwallet-docs-release-unsigned.aab
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore docwallet-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar docwallet-docs-release-signed.aab \
            docwallet-docs-release-unsigned.aab \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs docwallet-docs-release-signed.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: docwallet-docs-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload unsigned AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: docwallet-docs-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: docwallet-docs-release-aab-signed
          path: docwallet-docs-release-signed.aab
          if-no-files-found: ignore
