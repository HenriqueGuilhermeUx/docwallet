name: Build Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'

jobs:
  android:
    name: Build APK and unsigned AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_DOCWALLET_API_URL: https://docwallet-backend.onrender.com
          VITE_DOCWALLET_CHAIN_ID: 137
          VITE_DOCWALLET_NETWORK_NAME: Polygon
          VITE_DOCWALLET_RPC_URL: https://polygon-rpc.com
          VITE_DOCWALLET_EXPLORER_URL: https://polygonscan.com/tx
          VITE_DOCWALLET_NATIVE_NAME: POL
          VITE_DOCWALLET_NATIVE_SYMBOL: POL
          VITE_DOCWALLET_NATIVE_DECIMALS: 18
          VITE_DOCWALLET_NOTARIZATION_PRICE_NATIVE: 0.01
          VITE_DOCWALLET_TREASURY_ADDRESS: ${{ secrets.VITE_DOCWALLET_TREASURY_ADDRESS }}
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Build release bundle unsigned
        run: cd android && ./gradlew bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: docwallet-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: docwallet-android-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
